global:
  resolve_timeout: 1m

route:
  receiver: "selfhealing-webhook"
  group_by:
    - alertname
    - service
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m

receivers:
  - name: "selfhealing-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:5000/alert"
        send_resolved: true
        http_config:
          basic_auth:
            username: selfhealing
            password_file: /etc/alertmanager/secrets/webhook-token